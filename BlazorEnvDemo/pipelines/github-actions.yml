# GitHub Actions Workflow — BlazorEnvDemo
#
# Proves the finding: no csproj changes are needed to target UAT or Production.
# WasmApplicationEnvironmentName is set per job via env variables.

name: Publish Blazor WASM — Multi-Environment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: Environment to publish (UAT | Production)
        required: false
        default: UAT

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Job: Publish UAT artifact
  # ─────────────────────────────────────────────────────────────────────────────
  publish-uat:
    name: Publish — UAT
    runs-on: ubuntu-latest
    env:
      WASM_ENV: UAT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish Blazor WASM (UAT)
        # WasmApplicationEnvironmentName=UAT bakes the environment into the
        # publish output. The client will load appsettings.UAT.json at runtime.
        # No source code or csproj modification is required.
        run: |
          dotnet publish BlazorEnvDemo/BlazorEnvDemo.csproj \
            -c Release \
            -p:WasmApplicationEnvironmentName=${{ env.WASM_ENV }} \
            -o ./publish/${{ env.WASM_ENV }}

      - name: Upload UAT artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlazorEnvDemo-${{ env.WASM_ENV }}
          path: ./publish/${{ env.WASM_ENV }}/wwwroot

  # ─────────────────────────────────────────────────────────────────────────────
  # Job: Publish Production artifact
  # ─────────────────────────────────────────────────────────────────────────────
  publish-production:
    name: Publish — Production
    runs-on: ubuntu-latest
    env:
      WASM_ENV: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Publish Blazor WASM (Production)
        run: |
          dotnet publish BlazorEnvDemo/BlazorEnvDemo.csproj \
            -c Release \
            -p:WasmApplicationEnvironmentName=${{ env.WASM_ENV }} \
            -o ./publish/${{ env.WASM_ENV }}

      - name: Upload Production artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlazorEnvDemo-${{ env.WASM_ENV }}
          path: ./publish/${{ env.WASM_ENV }}/wwwroot

  # ─────────────────────────────────────────────────────────────────────────────
  # Job: Deploy UAT to Azure Static Web Apps (or swap for App Service)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-uat:
    name: Deploy — UAT
    runs-on: ubuntu-latest
    needs: publish-uat
    environment: UAT
    env:
      WASM_ENV: UAT

    steps:
      - name: Download UAT artifact
        uses: actions/download-artifact@v4
        with:
          name: BlazorEnvDemo-${{ env.WASM_ENV }}
          path: ./artifact

      - name: Deploy to Azure Static Web Apps (UAT)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_UAT }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./artifact
          skip_app_build: true
